blueprint:
  source_url: https://raw.githubusercontent.com/rickard2014/hass-blueprints/main/blueprints/automation/rickard2014/SyncStatesTwo.yaml
  name: Synchronize Two Switches (or Lights)
  description: Bind two switch or light entities together to act in unison (selected entities must all support the same state values)
  domain: automation
  input:
    entity_1:
      name: Entity 1
      selector:
        entity:
          domain:
            - switch
            - light
    entity_2:
      name: Entity 2
      selector:
        entity:
          domain:
            - switch
            - light

trigger:
  - entity_id:
      - !input entity_1
      - !input entity_2
    platform: state
    to: ["on", "off"]

action:
  - condition: template
    value_template: "{{ trigger.to_state.state in ['on', 'off'] }}"
  - service: "homeassistant.turn_{{ trigger.to_state.state }}"
    target:
      entity_id:
        - !input entity_1
        - !input entity_2

mode: single
