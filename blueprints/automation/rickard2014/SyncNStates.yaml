# Synchronize Multiple Switches (or Lights) — "paralelo" (three-way emulado)
#
# Mantém N interruptores/luzes no mesmo estado. Substitui SyncStatesTwo/Three/
# Four, que eram o mesmo problema escrito três vezes com 2, 3 e 4 inputs fixos.
#
# ---------------------------------------------------------------------------
# POR QUE ESTA BLUEPRINT TEM GUARDAS — leia antes de simplificar
# ---------------------------------------------------------------------------
# Em 2026-08-19 uma instância entrou em laço real: um grupo de três entidades
# acumulou 4671 mudanças de estado em 45 min, a luz piscou, e alguém acabou
# cortando a energia pela fiação — queimando um interruptor.
#
# A versão em produção naquele dia comandava TODAS as entidades do grupo,
# INCLUSIVE a que tinha disparado, tirava a direção do comando do último relato
# recebido, e não checava se os estados de fato divergiam. Esse desenho é um
# AMPLIFICADOR: qualquer discordância momentânea entre os membros vira comando
# no grupo inteiro, e a confirmação de cada aparelho reentra como gatilho novo.
# Isso basta para uma oscilação se sustentar, em qualquer grupo.
#
# ---------------------------------------------------------------------------
# CORREÇÃO DE UMA EXPLICAÇÃO ERRADA QUE ESTE ARQUIVO JÁ CARREGOU
# ---------------------------------------------------------------------------
# A versão anterior deste cabeçalho afirmava que o laço se sustentava porque
# dispositivo Zigbee End Device (TS0601 sem neutro) confirma "segundos depois e
# fora de ordem", enquanto Router confirma em milissegundos. Foi medido depois,
# no histórico do próprio incidente, e é FALSO.
#
# Medida limpa de comando→confirmação, com o grupo parado 38 min antes e um
# único toque físico iniciando:
#
#     +49 ms   End Device (TS0601 sem neutro)
#     +238 ms  Router (TS0003)
#
# O End Device respondeu 5x MAIS RÁPIDO que o router do mesmo grupo, e em ordem.
# Na mesma janela, dois outros grupos que também misturavam End Device com
# Router foram usados e sincronizaram normalmente, sem oscilar.
#
# O tipo do dispositivo na malha Zigbee não explica o incidente; o desenho da
# blueprint explica. O que disparou aquele grupo específico — uma reversão de
# estado 437 ms depois do grupo já estar sincronizado, que a automação daquele
# desenho não produz — segue INDETERMINADO, e fica registrado como tal em vez de
# preenchido com hipótese. Também segue aberto por que um grupo de três entidades
# oscilou e os de duas não, sendo os arquivos estruturalmente idênticos.
#
# ---------------------------------------------------------------------------
# AS QUATRO GUARDAS, em ordem de curto-circuito
# ---------------------------------------------------------------------------
# 1. alvo válido      o estado do gatilho é on/off.
# 2. não é recuperação quem volta de queda obedece ao grupo, não o comanda. Sem
#                     isto, um reload restaura dezenas de entidades de uma vez e
#                     todo paralelo dispara junto.
# 3. grupo íntegro    nenhum membro unavailable/unknown. Dispositivo caído não
#                     comanda nem é comandado.
# 4. divergência      E É ESTA QUE FECHA O LAÇO. Quando os estados já batem não
#                     há o que fazer, e o eco morre na condição, não na ação.
#
# Somado a isso, o alvo NUNCA inclui a entidade que disparou, e inclui apenas as
# que de fato discordam. É o que corta o amplificador na raiz.
#
# ---------------------------------------------------------------------------
# mode: queued, max: 2 — E O QUE ISSO REALMENTE FAZ
# ---------------------------------------------------------------------------
# Verificado em AutomationEntity.async_trigger: quando um gatilho dispara, o HA
# renderiza `variables:` e avalia `condition:` IMEDIATAMENTE, e só então chama
# action_script.async_run, que é onde mode/max são aplicados. Em mode: queued,
# portanto, só a AÇÃO é enfileirada.
#
# Consequência: `alvo`, abaixo, é lido no disparo e não no desenfileiramento —
# é equivalente a trigger.to_state.state. Uma versão anterior deste cabeçalho
# afirmava que ler ao vivo "é o que torna o queued seguro". NÃO É. Quem fecha o
# laço é a guarda de divergência.
#
# Isto NÃO quer dizer que a blueprint esteja quebrada. No disparo a máquina de
# estados já contém os valores atuais, então a guarda de divergência identifica
# corretamente quem discorda, e o alvo segue excluindo quem disparou. As duas
# proteções que importam continuam de pé.
#
# O que falta: não existe checagem de frescor no DESENFILEIRAMENTO. Uma execução
# que ficou na fila age com a informação do momento em que foi enfileirada —
# limitada por settle_time, ou seja, no máximo ~0,3 s de defasagem, com max: 2.
# É estreito, e não é o modo de falha do incidente.
#
# Para essa checagem existir, o cálculo de alvo e divergentes precisa migrar
# para DENTRO de `action:`, num passo `variables:` seguido de condição —
# templates de passos da ação são renderizados quando o passo executa. Melhoria
# conhecida, deliberadamente não aplicada até aqui.
#
# Por que queued e não single: com single, qualquer disparo dentro da janela de
# settle_time é DESCARTADO, e isso quebra um caso real — ligar a luz sem querer
# e apertar de novo para desligar em menos de settle_time. Com queued o toque é
# enfileirado e honrado. max: 2 porque a fila existe para absorver o toque humano
# seguinte, não para acumular eco: do terceiro em diante, descarta calado.
#
# ---------------------------------------------------------------------------
# settle_time, padrão 0.3 s
# ---------------------------------------------------------------------------
# Janela de não-reentrada aplicada DEPOIS da chamada de serviço: não atrasa a
# luz, só limita a taxa de reentrada. NÃO é a proteção contra laço.
#
# 0,3 s foi escolhido por experiência de uso: curto o bastante para não ser
# percebido em "liguei sem querer, quero desligar já". A tentação de subir para
# 2–3 s vinha da teoria Zigbee refutada acima — com a medição na mão, não há
# razão para mexer.
blueprint:
  source_url: https://raw.githubusercontent.com/rickard2014/hass-blueprints/main/blueprints/automation/rickard2014/SyncNStates.yaml
  name: Synchronize Multiple Switches (or Lights)
  description: >-
    Mantém N interruptores ou luzes no mesmo estado (paralelo / three-way
    emulado). Todas as entidades precisam aceitar os mesmos estados.
  domain: automation
  input:
    entities:
      name: Entities
      description: Os interruptores ou luzes a sincronizar
      selector:
        entity:
          multiple: true
          domain:
            - switch
            - light
    settle_time:
      name: Tempo de acomodação (s)
      description: >-
        Janela, depois de agir, em que a automação não reentra. NÃO é a
        proteção contra laço — essa é a guarda de divergência, e é ela que
        fecha o caso. 0.3 s serve para qualquer grupo; foi medido que o tipo
        Zigbee do dispositivo (Router ou End Device) não muda o quadro. Só
        mexa aqui se tiver medição própria mostrando necessidade.
      default: 0.3
      selector:
        number:
          min: 0.1
          max: 15
          step: 0.1
          unit_of_measurement: s
          mode: box

mode: queued
max: 2
max_exceeded: silent

variables:
  members: !input entities
  # Lido ao vivo, no início desta execução — ver o cabeçalho.
  alvo: "{{ states(trigger.entity_id) }}"
  divergentes: >-
    {{ members | reject('eq', trigger.entity_id)
       | reject('is_state', alvo) | list }}

trigger:
  - platform: state
    entity_id: !input entities
    to: ["on", "off"]

condition:
  - condition: template          # 1. alvo válido
    value_template: "{{ alvo in ['on', 'off'] }}"
  - condition: template          # 2. não é recuperação de queda
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state not in ['unavailable', 'unknown'] }}
  - condition: template          # 3. grupo íntegro
    value_template: >-
      {{ members | select('is_state', 'unavailable') | list | count == 0
         and members | select('is_state', 'unknown') | list | count == 0 }}
  - condition: template          # 4. divergência — fecha o laço
    value_template: "{{ divergentes | count > 0 }}"

action:
  - service: "homeassistant.turn_{{ alvo }}"
    target:
      entity_id: "{{ divergentes }}"
  - delay:
      seconds: !input settle_time
