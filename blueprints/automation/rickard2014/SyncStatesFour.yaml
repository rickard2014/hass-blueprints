blueprint:
  source_url: https://raw.githubusercontent.com/rickard2014/hass-blueprints/main/blueprints/automation/rickard2014/SyncStatesFour.yaml
  name: Synchronize Switches and Lights
  description: Bind four switch or light entities together to act in unison (selected entities must all support the same state values)
  domain: automation
  input:
    entity_1:
      name: Entity 1
      selector:
        entity:
          domain:
            - switch
            - light
    entity_2:
      name: Entity 2
      selector:
        entity:
          domain:
            - switch
            - light
    entity_3:
      name: Entity 3
      selector:
        entity:
          domain:
            - switch
            - light
    entity_4:
      name: Entity 4
      selector:
        entity:
          domain:
            - switch
            - light

trigger:
  - entity_id:
      - !input entity_1
      - !input entity_2
      - !input entity_3
      - !input entity_4
    platform: state

action:
  - condition: template
    value_template: "{{ trigger.to_state.state in ['on', 'off'] }}"
  - service: "homeassistant.turn_{{ trigger.to_state.state }}"
    target:
      entity_id:
        - !input entity_1
        - !input entity_2
        - !input entity_3
        - !input entity_4
  - service: system_log.write
    data:
      message: "Synchronized state {{ trigger.to_state.state }} for entities."
      level: info

mode: single
